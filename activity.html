<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>时段活动 · 我们的小窝</title>
  <script>document.documentElement.classList.add("pt-loading");</script>
  <link rel="stylesheet" href="activity.css?v=2" />
  <link rel="stylesheet" href="corner-dogs.css?v=4" />
  <link rel="stylesheet" href="site-font.css?v=1" />
  <link rel="stylesheet" href="scroll-reveal.css?v=1" />
  <link rel="stylesheet" href="page-transition.css?v=8" />
  <link rel="stylesheet" href="ghost.css?v=3" />
</head>
<body>
  <div class="act-bg" aria-hidden="true">
    <span class="act-cloud act-cloud--1"></span>
    <span class="act-cloud act-cloud--2"></span>
    <span class="act-cloud act-cloud--3"></span>
  </div>

  <header class="site-nav" data-site-nav>
    <div class="site-nav__bar">
      <a class="site-nav__brand" href="index.html?skipCover=1#home">我们的小窝</a>
      <nav class="site-nav__links" aria-label="站内导航">
        <a href="index.html?skipCover=1#home">首页</a>
        <a href="places.html">今年想去</a>
        <a href="blog.html">双人博客</a>
        <a href="records.html">生活记录</a>
        <a href="photos.html">照片墙</a>
        <a class="is-active" href="activity.html" aria-current="page">时段活动</a>
      </nav>
    </div>
  </header>

  <main class="act-shell">
    <section class="act-main" aria-labelledby="activityTitle">
      <header class="act-head">
        <p class="act-kicker">今天每个时段，我们都把时间放在哪里了</p>
        <h1 id="activityTitle">时段活动</h1>
        <p class="act-summary" id="daySummary">选择日期后添加活动记录</p>
        <div class="act-head__tools">
          <div class="act-view" id="actView" aria-label="查看谁的时间安排">
            <button class="act-view__btn is-active" type="button" data-view="white">白狗</button>
            <button class="act-view__btn" type="button" data-view="brown">棕狗</button>
          </div>
          <button class="act-add-toggle" id="actFormToggle" type="button" aria-expanded="false" aria-controls="activityForm">
            ＋ 添加时间安排
          </button>
        </div>
      </header>

      <form class="act-form is-hidden" id="activityForm">
        <div class="act-form__row">
          <label class="act-field">
            <span>日期</span>
            <input id="actDate" type="date" required />
          </label>
          <div class="act-field">
            <span>作者</span>
            <div class="act-who" id="actWho">
              <button class="act-who__btn is-active" type="button" data-who="white">🐶 白狗</button>
              <button class="act-who__btn" type="button" data-who="brown">🐕 棕狗</button>
            </div>
          </div>
        </div>

        <div class="act-form__row">
          <label class="act-field">
            <span>时段</span>
            <select id="actPeriod" required></select>
          </label>
          <label class="act-field">
            <span>分类</span>
            <select id="actCategory" required>
              <option value="学习">学习</option>
              <option value="工作">工作</option>
              <option value="约会">约会</option>
              <option value="家务">家务</option>
              <option value="娱乐">娱乐</option>
              <option value="休息">休息</option>
              <option value="运动">运动</option>
              <option value="其他">其他</option>
            </select>
          </label>
          <label class="act-field act-field--small">
            <span>分钟</span>
            <input id="actMinutes" type="number" min="1" max="720" step="1" value="30" required />
          </label>
        </div>

        <label class="act-field">
          <span>做了什么</span>
          <textarea id="actText" rows="3" maxlength="120" placeholder="例如：一起整理照片墙，顺手改了几处小细节" required></textarea>
        </label>

        <button class="act-submit" type="submit">＋ 添加记录</button>
      </form>

      <section class="act-section" aria-labelledby="timelineTitle">
        <div class="act-section__head">
          <h2 id="timelineTitle">白狗的时间线</h2>
          <div class="act-legend">
            <span><i class="act-dot act-dot--white"></i>白狗</span>
            <span><i class="act-dot act-dot--brown"></i>棕狗</span>
          </div>
        </div>
        <div class="act-timeline" id="actTimeline"></div>
      </section>
    </section>

    <aside class="act-side" aria-label="当日统计">
      <section class="act-stat">
        <h2 id="categoryTitle">白狗分类占比</h2>
        <div class="act-donut" id="actDonut" aria-label="当日分类占比图">
          <span id="actDonutText">0 分钟</span>
        </div>
        <div class="act-bars" id="actBars"></div>
      </section>

      <section class="act-stat">
        <h2 id="periodTitle">白狗时段概览</h2>
        <div class="act-periods" id="actPeriods"></div>
      </section>
    </aside>
  </main>

  <script src="activity.js?v=2"></script>
  <script src="corner-dogs.js?v=5"></script>
  <script src="scroll-reveal.js?v=1"></script>
  <script src="ghost.js?v=3"></script>
  <script src="page-transition.js?v=14"></script>
</body>
</html>
